name: Actualizar Datos de Sismicidad EMSC

on:
  schedule:
    # Se ejecuta automáticamente cada 5 minutos
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizaciones-datos
  cancel-in-progress: false

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Crear carpeta de datos si no existe
        run: mkdir -p datos

      - name: Consultar API EMSC
        run: |
          curl -fLsS "https://www.seismicportal.eu/fdsnws/event/1/query?format=json&minlatitude=35.5&maxlatitude=39.0&minlongitude=-7.5&maxlongitude=-2.0&limit=1" > datos/sismicidad.json

      - name: Confirmar y subir los datos actualizados al repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add datos/sismicidad.json

          if git diff --cached --quiet; then
            echo "El archivo ya se encuentra en su versión más reciente."
            exit 0
          fi

          git pull --rebase origin main

          git add datos/sismicidad.json

          git commit -m "Automatización: Datos sísmicos actualizados [skip ci]"

          git push origin main
