name: Actualizar Datos de Sismicidad EMSC

on:
  schedule:
    # Se ejecuta de forma automática cada 5 minutos
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permite ejecución manual

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          # IMPORTANTE: Esto le da persistencia al token para poder hacer el push posterior
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Crear carpeta de datos si no existe
        run: mkdir -p datos

      - name: Consultar API EMSC sin restricciones de CORS
        run: |
          curl -s "https://www.seismicportal.eu/fdsnws/event/1/query?format=json&minlatitude=35.5&maxlatitude=39.0&minlongitude=-7.5&maxlongitude=-2.0&limit=1" > datos/sismos.json

      - name: Confirmar y subir los datos actualizados al repositorio
        run: |
          # CORRECCIÓN: Configuración de correo oficial y limpio para el bot de GitHub
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add datos/sismos.json
          
          # Comprueba si hay cambios antes de hacer commit y empujar al repositorio
          if ! git diff --cached --quiet; then
            git commit -m "Automatización: Datos sísmicos actualizados [skip ci]"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No hay cambios nuevos en los datos sísmicos."
          fi

