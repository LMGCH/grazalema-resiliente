name: Actualizar Datos de Sismicidad EMSC

on:
  schedule:
    # Se ejecuta automáticamente cada 5 minutos
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permite la ejecución manual con el botón gris

# SOLUCIÓN CRÍTICA: Forzamos al servidor a otorgar permisos explícitos de escritura al token incorporado
permissions:
  contents: write

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          # Mantenemos el repositorio vinculado con el token autorizado
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Crear carpeta de datos si no existe
        run: mkdir -p datos

      - name: Consultar API EMSC sin restricciones de CORS
        run: |
          curl -s "https://www.seismicportal.eu/fdsnws/event/1/query?format=json&minlatitude=35.5&maxlatitude=39.0&minlongitude=-7.5&maxlongitude=-2.0&limit=1" > datos/sismicidad.json

      - name: Confirmar y subir los datos actualizados al repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Forzamos a Git a refrescar su base de datos interna de archivos
          git update-index --refresh || true
          
          # Añadimos el archivo asegurando su persistencia en el árbol
          git add --all datos/sismicidad.json
          
          # Realizamos un commit explícito forzando el envío sin intermediarios
          if ! git diff --cached --quiet; then
            git commit -m "Automatización: Datos sísmicos actualizados [skip ci]"
            git push --force origin HEAD:${{ github.ref }}
          else
            echo "El archivo ya se encuentra en su versión más reciente."
          fi
