name: Actualizar Datos de Sismicidad EMSC

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizaciones-datos
  cancel-in-progress: false

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4 # Nota: v4 es la versión estable actual (v6 no existe de forma oficial aún)
        with:
          fetch-depth: 0

      - name: Crear carpeta de datos si no existe
        run: mkdir -p datos

      - name: Consultar API EMSC
        run: |
          curl -fLsS "https://www.seismicportal.eu/fdsnws/event/1/query?format=json&minlatitude=35.5&maxlatitude=39.0&minlongitude=-7.5&maxlongitude=-2.0&limit=1" > datos/sismicidad.json

      - name: Comprobar cambios
        id: cambios
        run: |
          if git diff --quiet -- datos/sismicidad.json; then
            echo "cambios=false" >> "$GITHUB_OUTPUT"
            echo "No se detectaron cambios."
          else
            echo "cambios=true" >> "$GITHUB_OUTPUT"
            echo "Se detectaron cambios."
          fi

      - name: Commit y Push cambios de forma segura
        if: steps.cambios.outputs.cambios == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 1. Primero preparamos el archivo modificado
          git add datos/sismicidad.json
          
          # 2. Creamos el commit localmente
          git commit -m "Automatización: Datos sísmicos actualizados [skip ci]"

          # 3. Traemos lo que haya cambiado en GitHub en estos 5 minutos y lo fusionamos limpiamente
          git pull origin main --rebase

          # 4. Subimos el resultado final definitivo
          git push origin main


          git commit -m "Automatización: Datos sísmicos actualizados [skip ci]"

          git push origin main
