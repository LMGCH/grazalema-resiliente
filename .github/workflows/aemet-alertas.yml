name: Actualizar alertas AEMET

on:
  schedule:
    - cron: '*/45 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Evita errores de historial de Git trayendo todas las ramas correctamente

      - name: Instalar Python
        uses: actions/setup-python@v5.3.0 # Forzamos la subversión más reciente que integra compatibilidad nativa con Node 24
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install feedparser requests

      - name: Ejecutar script
        run: |
          python scripts/actualizar_alertas.py

      - name: Commit y push de cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add datos/alertas.json

          # Si hay cambios confirmados (staged), hacemos el commit, sincronizamos y subimos
          if ! git diff --staged --quiet; then
            git commit -m "Actualizar alertas AEMET"
            git pull origin main --rebase # <--- SOLUCIÓN AL ERROR: Mezcla los cambios externos antes de subir
            git push origin main
          else
            echo "No se detectaron cambios en datos/alertas.json. Nada que actualizar."
          fi

