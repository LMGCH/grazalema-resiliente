name: Actualizar alertas AEMET

on:
  schedule:
    - cron: '*/45 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizaciones-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Instalar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests

      - name: Ejecutar script
        run: |
          python scripts/actualizar_alertas.py

      - name: Commit y push de cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add datos/alertas.json

          if git diff --staged --quiet; then
            echo "No se detectaron cambios en datos/alertas.json."
            exit 0
          fi

          git pull --rebase origin main

          git add datos/alertas.json

          git commit -m "Actualizar alertas AEMET"

          git push origin main
