name: Actualizar alertas AEMET

on:
  schedule:
    - cron: '*/45 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizaciones-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Instalar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests

      - name: Ejecutar script
        run: |
          python scripts/actualizar_alertas.py

      - name: Comprobar cambios
        id: cambios
        run: |
          if git diff --quiet -- datos/alertas.json; then
            echo "cambios=false" >> "$GITHUB_OUTPUT"
            echo "No se detectaron cambios."
          else
            echo "cambios=true" >> "$GITHUB_OUTPUT"
            echo "Se detectaron cambios."
          fi

      - name: Commit cambios
        if: steps.cambios.outputs.cambios == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git rebase origin/main

          git add datos/alertas.json
          git commit -m "Actualizar alertas AEMET"

          git push origin HEAD:main

          git commit -m "Actualizar alertas AEMET"

          git push origin main
